name: Inspect original Image Studio decompiled export

on:
  push:
    branches: [ "4.5" ]
    paths:
      - ".github/workflows/inspect-decompiled-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ImageStudio
        uses: actions/checkout@v5

      - name: Download the decompiled source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pavan3999/my-files/main/ImageStudio-decompiled.zip" \
            --output inspection/ImageStudio-decompiled.zip
          test -s inspection/ImageStudio-decompiled.zip
          sha256sum inspection/ImageStudio-decompiled.zip | tee inspection/archive.sha256
          unzip -t inspection/ImageStudio-decompiled.zip

      - name: Extract and inventory source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/extracted
          unzip -q inspection/ImageStudio-decompiled.zip -d inspection/extracted
          {
            echo "# Decompiled export inventory"
            echo
            echo "Archive SHA-256:"
            cat inspection/archive.sha256
            echo
            echo "Archive file listing:"
            find inspection/extracted -type f -printf '%P\t%s bytes\n' | sort
            echo
            echo "Build and manifest candidates:"
            find inspection/extracted -type f \
              \( -name 'AndroidManifest.xml' -o -name 'build.gradle' -o -name 'build.gradle.kts' \
                 -o -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'gradle-wrapper.properties' \
                 -o -name 'pom.xml' -o -name 'apktool.yml' \) -print | sort
            echo
            echo "Package declarations:"
            grep -RhoE '^package [A-Za-z0-9_.]+;' inspection/extracted \
              --include='*.java' 2>/dev/null | sort -u || true
          } > inspection/INVENTORY.md
          cat inspection/INVENTORY.md

      - name: Package inspection output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection-output
          cp inspection/INVENTORY.md inspection-output/
          cp inspection/archive.sha256 inspection-output/
          # Preserve the full extracted tree for source recovery; do not commit it automatically.
          cd inspection/extracted
          zip -qr ../../inspection-output/decompiled-source-export.zip .

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-studio-decompiled-inspection
          path: inspection-output/
          if-no-files-found: error
          retention-days: 14
