name: Import JADX source archive

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: import-jadx-4-4-2
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 4.5 branch
        uses: actions/checkout@v4
        with:
          ref: 4.5
          fetch-depth: 0

      - name: Download successful JADX artifact
        uses: actions/download-artifact@v4
        with:
          repository: pavan3999/ImageStudio
          run-id: 43833302886
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ImageStudio-4.4.2-JADX-2
          path: jadx-artifact

      - name: Validate and import recovered source
        shell: bash
        run: |
          set -euo pipefail
          test -s jadx-artifact/decompiled/resources/AndroidManifest.xml
          test -s jadx-artifact/decompiled/sources/com/redlee90/imagekitchenforandroid/MainActivity.java
          mkdir -p recovered/jadx-4.4.2
          cp -a jadx-artifact/decompiled/. recovered/jadx-4.4.2/
          {
            echo "# JADX recovery snapshot"
            echo
            echo "- Original APK: Image Studio 4.4.2"
            echo "- Package: com.redlee90.imagekitchenforandroid"
            echo "- Source artifact run: 43833302886"
            echo "- Generated by JADX; this is a reference snapshot, not a Gradle project."
            echo
            echo "## Inventory"
            echo "- Java files: $(find recovered/jadx-4.4.2/sources -type f -name '*.java' | wc -l)"
            echo "- Resource files: $(find recovered/jadx-4.4.2/resources/res -type f | wc -l)"
            echo "- Native ABI files: $(find recovered/jadx-4.4.2/resources/lib -type f | wc -l)"
          } > recovered/jadx-4.4.2/RECOVERY-INFO.md

      - name: Commit recovered reference source
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: 4.5
          commit_message: "Import JADX 4.4.2 recovery snapshot"
          file_pattern: recovered/jadx-4.4.2/**
